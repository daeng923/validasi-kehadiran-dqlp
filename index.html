<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: transparent !important; 
            margin: 0; padding: 0; overflow-x: hidden;
        }
        .spinner { border-top-color: #059669; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .select-none { -webkit-user-select: none; user-select: none; }
        
        /* Transition untuk elemen list */
        .list-item { transition: all 0.2s ease; }
        .list-item:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="select-none" oncontextmenu="return false;">

    <div class="w-full max-w-2xl mx-auto px-2 pt-2 pb-8">
        <div class="bg-white p-4 md:p-6 rounded-[2rem]">
            
            <div id="loginBox" class="space-y-6">
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-slate-800 tracking-tight">DQLP Validation System</h2>
                    <div class="h-1 w-10 bg-emerald-500 mx-auto mt-2 rounded-full"></div>
                </div>

                <div class="bg-emerald-50 border-l-4 border-emerald-500 p-4 rounded-r-2xl">
                    <p class="text-xs text-emerald-800 leading-relaxed font-medium">
                        Masukkan <b>Email</b> dan <b>Token</b> harian untuk memvalidasi presensi.
                    </p>
                </div>
                
                <div class="space-y-4">
                    <input id="email" type="email" placeholder="Email Pengajar" class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 outline-none text-sm">
                    <input id="token" type="password" placeholder="Token Akses" class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 outline-none text-sm">
                    <button id="btnLogin" onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all text-sm tracking-wide">
                        Verifikasi Akses
                    </button>
                </div>
            </div>

            <div id="mainBox" class="hidden space-y-6">
                <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <div class="flex flex-col">
                        <span class="text-[9px] uppercase font-bold text-slate-400 tracking-widest">Akses Aktif</span>
                        <div class="text-xs font-bold text-slate-600 truncate max-w-[150px]" id="userEmailDisplay"></div>
                    </div>
                    <button onclick="location.reload()" class="px-3 py-1.5 rounded-lg text-[10px] font-bold text-red-400 hover:bg-red-50 transition-colors uppercase">Logout</button>
                </div>

                <div class="space-y-3">
                    <select id="skema" class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 font-semibold text-sm outline-none"></select>
                    <button id="btnLoad" onclick="loadData()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3.5 rounded-2xl transition-all text-xs">
                        Tampilkan Peserta
                    </button>
                </div>

                <div id="filterContainer" class="hidden space-y-4 pt-4 border-t border-slate-50">
                    <input id="searchBox" onkeyup="filterList()" type="text" placeholder="Cari nama peserta..." class="w-full px-4 py-3 text-xs rounded-xl border border-slate-100 bg-slate-50 outline-none">
                    <div class="flex items-center justify-between px-1">
                        <button onclick="toggleSelectAll()" id="btnSelectAll" class="text-[10px] font-bold text-emerald-600 hover:underline">Batalkan Semua</button>
                        <div id="summaryBox"></div>
                    </div>
                </div>

                <div id="loading" class="hidden text-center py-10">
                    <div class="spinner w-8 h-8 border-[3px] border-slate-100 rounded-full mx-auto mb-3"></div>
                </div>

                <div id="emptyBox"></div>
                <div id="list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar"></div>

                <div class="pt-2">
                    <button id="btnSave" onclick="confirmSave()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-xl text-sm tracking-wide transition-all">
                        Simpan Validasi Kehadiran
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlert" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 max-w-xs w-full shadow-2xl text-center">
            <div id="alertIcon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4"></div>
            <h3 id="alertTitle" class="text-md font-bold text-slate-800 mb-1"></h3>
            <p id="alertMessage" class="text-[11px] text-slate-500 mb-6 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-[10px] uppercase tracking-widest">Tutup</button>
        </div>
    </div>

    <div id="customConfirm" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/40 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] p-8 max-w-xs w-full shadow-2xl text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-amber-100 mb-4 text-amber-600">
                <i class="fa-solid fa-question text-xl"></i>
            </div>
            <h3 class="text-md font-bold text-slate-800 mb-1">Konfirmasi Simpan?</h3>
            <p id="confirmMessage" class="text-[11px] text-slate-500 mb-6 leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-500 font-bold py-3 rounded-xl text-[10px]">Batal</button>
                <button id="confirmYesBtn" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl text-[10px]">Simpan</button>
            </div>
        </div>
    </div>

<script>
// PASTIKAN URL API ANDA BENAR
const API_URL = "https://script.google.com/macros/s/AKfycbz5tu40Iv18YUf4kJ8KYXp2THnsUmQ-PmRtLpAW3LGOqFwsdmaYV_3tKtaiKahyWZrgcA/exec";
let EMAIL = "", DATA = [], IS_ALL_SELECTED = true;

const $ = id => document.getElementById(id);

function showAlert(title, message, type = 'success') {
    const icon = $('alertIcon');
    $('alertTitle').innerText = title;
    $('alertMessage').innerText = message;
    icon.className = `mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 ${type === 'error' ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}`;
    icon.innerHTML = type === 'error' ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-check"></i>';
    $('customAlert').classList.remove('hidden');
}

function closeAlert() { $('customAlert').classList.add('hidden'); }
function closeConfirm() { $('customConfirm').classList.add('hidden'); }

async function login() {
    const e = $("email").value.trim(); const t = $("token").value.trim();
    if(!e || !t) return showAlert("Opps!", "Data tidak lengkap.", "error");
    $("btnLogin").disabled = true; $("btnLogin").innerText = "Proses...";
    try {
        const r = await fetch(`${API_URL}?action=login&email=${encodeURIComponent(e)}&token=${encodeURIComponent(t)}`);
        const j = await r.json();
        if(!j.status) throw new Error(j.msg);
        EMAIL = j.email; $("userEmailDisplay").innerText = EMAIL;
        $("loginBox").classList.add("hidden"); $("mainBox").classList.remove("hidden");
        $("skema").innerHTML = (j.skema || []).map(s => `<option value="${s}">${s}</option>`).join("");
    } catch (err) { showAlert("Gagal Login", err.message, "error"); }
    finally { $("btnLogin").disabled = false; $("btnLogin").innerText = "Verifikasi Akses"; }
}

async function loadData() {
    $("btnLoad").disabled = true; $("loading").classList.remove("hidden");
    $("list").innerHTML = ""; $("btnSave").classList.add("hidden");
    try {
        const r = await fetch(`${API_URL}?action=list&email=${encodeURIComponent(EMAIL)}&skema=${encodeURIComponent($("skema").value)}`);
        DATA = await r.json();
        if(DATA.length === 0) {
            $("emptyBox").innerHTML = `<div class="p-6 text-slate-400 text-xs text-center italic">Tidak ada antrean baru.</div>`;
        } else {
            $("filterContainer").classList.remove("hidden"); $("btnSave").classList.remove("hidden");
            renderList(DATA); updateSummary();
        }
    } catch (err) { showAlert("Error", "Gagal sinkronisasi.", "error"); }
    finally { $("loading").classList.add("hidden"); $("btnLoad").disabled = false; }
}

function formatTgl(raw) {
    if(!raw || raw === "-") return "-";
    const d = new Date(raw);
    if(isNaN(d)) return raw;
    const tgl = d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
    const jam = d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    return `<div class="text-[9px] font-bold text-slate-700">${tgl}</div><div class="text-[8px] text-slate-400 font-medium">${jam}</div>`;
}

function renderList(items) {
    $("list").innerHTML = items.map((r, i) => {
        let fotoUrl = r.foto ? r.foto.replace("http://", "https://") : "";
        const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(r.nama)}&background=random&color=fff&size=100`;
        return `
        <label class="list-item flex items-center gap-3 p-3 bg-slate-50 border border-slate-100 rounded-2xl hover:bg-white hover:shadow-md transition-all cursor-pointer group" data-nama="${r.nama.toLowerCase()}">
            <input type="checkbox" checked data-i="${i}" onchange="updateSummary()" class="w-4 h-4 rounded text-emerald-600 border-slate-200 cursor-pointer">
            
            <div class="relative w-10 h-10 flex-shrink-0">
                <img src="${fotoUrl}" onerror="this.src='${fallback}'" referrerpolicy="no-referrer" loading="lazy" class="w-full h-full rounded-full object-cover border border-white shadow-sm">
            </div>

            <div class="flex-1 min-w-0">
                <div class="text-[11px] font-bold text-slate-700 truncate group-hover:text-emerald-700 transition-colors">${r.nama}</div>
                <div class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">${r.nip}</div>
            </div>
            
            <div class="text-right">${formatTgl(r.waktu)}</div>
        </label>
        `;
    }).join("");
}

function toggleSelectAll() {
    const checkboxes = document.querySelectorAll("#list input[type='checkbox']");
    IS_ALL_SELECTED = !IS_ALL_SELECTED;
    checkboxes.forEach(cb => cb.checked = IS_ALL_SELECTED);
    $("btnSelectAll").innerText = IS_ALL_SELECTED ? "Batalkan Semua" : "Pilih Semua";
    updateSummary();
}

function updateSummary() {
    const checked = document.querySelectorAll("#list input:checked").length;
    $("summaryBox").innerHTML = `<span class="text-[9px] font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-full">${checked} Terpilih</span>`;
}

function filterList() {
    const q = $("searchBox").value.toLowerCase();
    document.querySelectorAll('#list label').forEach(el => {
        el.style.display = el.getAttribute('data-nama').includes(q) ? "flex" : "none";
    });
}

function confirmSave() {
    const count = document.querySelectorAll("#list input:checked").length;
    if(count === 0) return showAlert("Opps!", "Pilih minimal satu.", "error");
    $("confirmMessage").innerText = `Validasi kehadiran untuk ${count} peserta?`;
    $("customConfirm").classList.remove("hidden");
    $("confirmYesBtn").onclick = () => { closeConfirm(); simpanData(); };
}

async function simpanData() {
    const rows = [];
    document.querySelectorAll("#list input:checked").forEach(cb => rows.push(DATA[cb.dataset.i]));
    $("btnSave").disabled = true; $("loading").classList.remove("hidden");
    try {
        const payload = new URLSearchParams();
        payload.append("action", "simpan");
        payload.append("email", EMAIL);
        payload.append("skema", $("skema").value);
        payload.append("rows", JSON.stringify(rows));
        const r = await fetch(API_URL, { method: "POST", body: payload });
        const j = await r.json();
        if(!j.status) throw new Error(j.msg);
        showAlert("Berhasil", j.msg, "success");
        loadData();
    } catch (err) { showAlert("Gagal Simpan", err.message, "error"); }
    finally { $("loading").classList.add("hidden"); $("btnSave").disabled = false; }
}
</script>
</body>
</html>
