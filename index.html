<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: transparent !important; 
            margin: 0; padding: 0;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* State saat Checkbox terpilih - Mengubah border dan background kartu */
        .checkbox-custom:checked + label {
            border-color: #10b981 !important;
            background-color: #f0fdf4 !important; /* Hijau emerald sangat muda */
            box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.1);
        }

        /* State saat Checkbox terpilih - Menampilkan ikon check di kanan */
        .checkbox-custom:checked + label .status-icon {
            color: #10b981 !important;
            opacity: 1 !important;
        }

        .select-none { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="select-none bg-transparent" oncontextmenu="return false;">

    <div class="w-full max-w-2xl mx-auto px-2 pt-4 pb-10">
        <div class="relative bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
            
            <div class="p-6 md:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight italic">DQLP <span class="text-emerald-600 font-medium not-italic">Validation</span></h2>
                    <div class="flex justify-center gap-1 mt-2">
                        <div class="h-1 w-8 bg-emerald-500 rounded-full"></div>
                        <div class="h-1 w-2 bg-slate-200 rounded-full"></div>
                    </div>
                </div>

                <div id="loginBox" class="space-y-6">
                    <div class="bg-slate-50 border border-slate-100 p-5 rounded-3xl flex items-start gap-4">
                        <div class="bg-emerald-100 p-2.5 rounded-2xl text-emerald-600 flex-shrink-0">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-relaxed font-medium">
                            Selamat datang, Pengajar. Gunakan <b>Email</b> dan <b>Token</b> harian untuk memvalidasi presensi peserta.
                        </p>
                    </div>
                    <div class="space-y-4">
                        <input id="email" type="email" placeholder="Email Pengajar" class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50 outline-none text-sm focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all">
                        <input id="token" type="password" placeholder="Token Akses" class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50 outline-none text-sm focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all">
                        <button id="btnLogin" onclick="login()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98] text-sm tracking-widest uppercase">
                            Buka Portal
                        </button>
                    </div>
                </div>

                <div id="mainBox" class="hidden space-y-6">
                    <div class="flex items-center justify-between bg-slate-50/80 p-5 rounded-[2rem] border border-slate-100">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-md">
                                <i class="fa-solid fa-user-tie"></i>
                            </div>
                            <div class="flex flex-col min-w-0">
                                <span class="text-[9px] uppercase font-bold text-slate-400 tracking-widest">Authorized</span>
                                <div class="text-xs font-bold text-slate-700 truncate max-w-[140px]" id="userEmailDisplay"></div>
                            </div>
                        </div>
                        <button onclick="location.reload()" class="p-3 rounded-2xl text-red-400 hover:bg-red-50 transition-colors">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>

                    <div class="space-y-3">
                        <select id="skema" class="w-full px-5 py-4 rounded-2xl border border-slate-100 bg-slate-50 font-bold text-sm outline-none text-slate-700 appearance-none"></select>
                        <button id="btnLoad" onclick="loadData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-emerald-100 transition-all text-sm uppercase tracking-widest">
                            Tampilkan Daftar Peserta
                        </button>
                    </div>

                    <div id="filterContainer" class="hidden space-y-4 pt-4 border-t border-slate-100">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                            <input id="searchBox" onkeyup="filterList()" type="text" placeholder="Cari nama atau NIP..." class="w-full pl-12 pr-5 py-3.5 text-xs rounded-xl border border-slate-100 bg-slate-50 outline-none">
                        </div>
                        <div class="flex items-center justify-between px-2">
                            <button onclick="toggleSelectAll()" id="btnSelectAll" class="text-[10px] font-bold text-slate-400 hover:text-emerald-600 transition-colors uppercase tracking-wider">
                                <i class="fa-solid fa-check-double mr-1"></i> Pilih Semua
                            </button>
                            <div id="summaryBox"></div>
                        </div>
                        
                        <div id="list" class="space-y-3 max-h-[450px] overflow-y-auto pr-2 custom-scrollbar"></div>

                        <div class="pt-4">
                            <button id="btnSave" onclick="confirmSave()" class="hidden w-full bg-slate-900 hover:bg-black text-white font-bold py-5 rounded-[2rem] shadow-2xl transition-all active:scale-[0.98] text-sm uppercase tracking-[0.2em]">
                                Simpan Validasi
                            </button>
                        </div>
                    </div>

                    <div id="loading" class="hidden text-center py-10">
                        <div class="spinner w-10 h-10 border-[3px] border-slate-100 rounded-full mx-auto mb-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlert" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-xs w-full shadow-2xl text-center">
            <div id="alertIcon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6"></div>
            <h3 id="alertTitle" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="alertMessage" class="text-xs text-slate-500 mb-8 leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl text-xs uppercase">Tutup</button>
        </div>
    </div>

    <div id="customConfirm" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-xs w-full shadow-2xl text-center">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-amber-50 text-amber-500 mb-6">
                <i class="fa-solid fa-circle-question text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">Simpan Validasi?</h3>
            <p id="confirmMessage" class="text-xs text-slate-500 mb-8 leading-relaxed"></p>
            <div class="flex gap-4">
                <button onclick="closeConfirm()" class="flex-1 bg-slate-100 text-slate-400 font-bold py-4 rounded-2xl text-xs">Batal</button>
                <button id="confirmYesBtn" class="flex-1 bg-emerald-600 text-white font-bold py-4 rounded-2xl text-xs shadow-lg">Simpan</button>
            </div>
        </div>
    </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz5tu40Iv18YUf4kJ8KYXp2THnsUmQ-PmRtLpAW3LGOqFwsdmaYV_3tKtaiKahyWZrgcA/exec"; // Ganti dengan URL GAS Anda
let EMAIL = "", DATA = [], IS_ALL_SELECTED = true;

const $ = id => document.getElementById(id);

function showAlert(title, message, type = 'success') {
    const icon = $('alertIcon');
    $('alertTitle').innerText = title;
    $('alertMessage').innerText = message;
    icon.className = `mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6 ${type === 'error' ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-500'}`;
    icon.innerHTML = type === 'error' ? '<i class="fa-solid fa-xmark text-2xl"></i>' : '<i class="fa-solid fa-check text-2xl"></i>';
    $('customAlert').classList.remove('hidden');
}

function closeAlert() { $('customAlert').classList.add('hidden'); }
function closeConfirm() { $('customConfirm').classList.add('hidden'); }

async function login() {
    const e = $("email").value.trim(); const t = $("token").value.trim();
    if(!e || !t) return showAlert("Opps!", "Email/Token wajib diisi.", "error");
    $("btnLogin").disabled = true; $("btnLogin").innerText = "Loading...";
    try {
        const r = await fetch(`${API_URL}?action=login&email=${e}&token=${t}`);
        const j = await r.json();
        if(!j.status) throw new Error(j.msg);
        EMAIL = j.email; $("userEmailDisplay").innerText = EMAIL;
        $("loginBox").classList.add("hidden"); $("mainBox").classList.remove("hidden");
        $("skema").innerHTML = (j.skema || []).map(s => `<option value="${s}">${s}</option>`).join("");
    } catch (err) { showAlert("Gagal Login", err.message, "error"); }
    finally { $("btnLogin").disabled = false; $("btnLogin").innerText = "Buka Portal"; }
}

async function loadData() {
    $("btnLoad").disabled = true; $("loading").classList.remove("hidden");
    $("list").innerHTML = ""; $("btnSave").classList.add("hidden");
    try {
        const r = await fetch(`${API_URL}?action=list&email=${EMAIL}&skema=${$("skema").value}`);
        DATA = await r.json();
        if(DATA.length === 0) {
            $("list").innerHTML = `<div class="p-10 text-slate-300 text-[11px] text-center italic">Antrean kosong.</div>`;
        } else {
            $("filterContainer").classList.remove("hidden"); $("btnSave").classList.remove("hidden");
            renderList(DATA); updateSummary();
        }
    } catch (err) { showAlert("Error", "Gagal sinkron data.", "error"); }
    finally { $("loading").classList.add("hidden"); $("btnLoad").disabled = false; }
}

function formatWaktu(raw) {
    if(!raw || raw === "-") return "-";
    const d = new Date(raw);
    const tgl = d.toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
    const jam = d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    return `<div class="text-[9px] font-bold text-slate-700">${tgl}</div><div class="text-[8px] text-slate-300 font-medium">${jam}</div>`;
}

function renderList(items) {
    $("list").innerHTML = items.map((r, i) => {
        let f = r.foto ? r.foto.replace("http://", "https://") : "";
        const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(r.nama)}&background=random&color=fff&size=100`;
        return `
        <div class="relative">
            <input type="checkbox" checked data-i="${i}" id="p-${i}" onchange="updateSummary()" class="hidden checkbox-custom">
            
            <label for="p-${i}" class="flex items-center gap-4 p-4 bg-white border border-slate-100 rounded-[1.5rem] cursor-pointer transition-all hover:border-emerald-200">
                <div class="relative w-11 h-11 flex-shrink-0">
                    <img src="${f}" onerror="this.src='${fallback}'" referrerpolicy="no-referrer" class="w-full h-full rounded-2xl object-cover border-2 border-white shadow-sm ring-1 ring-slate-100">
                </div>
                <div class="flex-1 min-w-0">
                    <div class="text-[12px] font-bold text-slate-700 truncate">${r.nama}</div>
                    <div class="text-[9px] text-slate-400 font-extrabold uppercase tracking-widest">${r.nip}</div>
                </div>
                
                <div class="status-icon flex flex-col items-end gap-1 opacity-20 transition-all">
                    <i class="fa-solid fa-circle-check text-lg"></i>
                    ${formatWaktu(r.waktu)}
                </div>
            </label>
        </div>
        `;
    }).join("");
}

function toggleSelectAll() {
    const cbs = document.querySelectorAll("#list input[type='checkbox']");
    IS_ALL_SELECTED = !IS_ALL_SELECTED;
    cbs.forEach(cb => cb.checked = IS_ALL_SELECTED);
    $("btnSelectAll").innerHTML = IS_ALL_SELECTED ? '<i class="fa-solid fa-xmark mr-1"></i> Batal Semua' : '<i class="fa-solid fa-check-double mr-1"></i> Pilih Semua';
    updateSummary();
}

function updateSummary() {
    const c = document.querySelectorAll("#list input:checked").length;
    $("summaryBox").innerHTML = `<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full ring-1 ring-emerald-100">${c} Terpilih</span>`;
}

function filterList() {
    const q = $("searchBox").value.toLowerCase();
    document.querySelectorAll('#list .relative').forEach(el => {
        const n = el.innerText.toLowerCase();
        el.style.display = n.includes(q) ? "block" : "none";
    });
}

function confirmSave() {
    const c = document.querySelectorAll("#list input:checked").length;
    if(c === 0) return showAlert("Opps!", "Pilih minimal satu.", "error");
    $("confirmMessage").innerText = `Validasi kehadiran untuk ${c} peserta terpilih?`;
    $("customConfirm").classList.remove("hidden");
    $("confirmYesBtn").onclick = () => { closeConfirm(); simpanData(); };
}

async function simpanData() {
    const rows = [];
    document.querySelectorAll("#list input:checked").forEach(cb => rows.push(DATA[cb.dataset.i]));
    $("btnSave").disabled = true; $("loading").classList.remove("hidden");
    try {
        const p = new URLSearchParams();
        p.append("action", "simpan"); p.append("email", EMAIL); p.append("skema", $("skema").value); p.append("rows", JSON.stringify(rows));
        const r = await fetch(API_URL, { method: "POST", body: p });
        const j = await r.json();
        if(!j.status) throw new Error(j.msg);
        showAlert("Berhasil", j.msg, "success");
        loadData();
    } catch (err) { showAlert("Gagal Simpan", err.message, "error"); }
    finally { $("loading").classList.add("hidden"); $("btnSave").disabled = false; }
}
</script>
</body>
</html>
