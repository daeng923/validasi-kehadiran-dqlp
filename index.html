<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi DQLP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4">

    <div class="max-w-md mx-auto py-8">
        <div id="app" class="bg-white rounded-[2.5rem] shadow-2xl p-6 border border-slate-100">
            
            <div id="loginBox" class="space-y-4">
                <h1 class="text-2xl font-bold text-emerald-900 text-center mb-6">Portal Validasi</h1>
                <input id="email" type="email" placeholder="Email Pengajar" class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 outline-none">
                <input id="token" type="password" placeholder="Token Harian" class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 outline-none">
                <button onclick="login()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg">Masuk</button>
            </div>

            <div id="mainBox" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <span id="userEmailDisplay" class="text-[10px] font-bold text-slate-400"></span>
                    <button onclick="location.reload()" class="text-red-400 text-[10px] font-bold uppercase">Logout</button>
                </div>
                <select id="skema" class="w-full px-4 py-3.5 rounded-2xl border bg-slate-50 font-semibold text-sm outline-none"></select>
                <button onclick="loadData()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-widest">Tampilkan Peserta</button>
                
                <div id="list" class="space-y-3 max-h-[400px] overflow-y-auto mt-4 pr-1"></div>
                <button id="btnSave" onclick="simpanData()" class="hidden w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl mt-4 shadow-xl">Konfirmasi Kehadiran</button>
            </div>
        </div>
    </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz5tu40Iv18YUf4kJ8KYXp2THnsUmQ-PmRtLpAW3LGOqFwsdmaYV_3tKtaiKahyWZrgcA/exec"; //
let EMAIL = "", DATA = [];

const $ = id => document.getElementById(id);

async function login() {
    const e = $("email").value; const t = $("token").value;
    try {
        const r = await fetch(`${API_URL}?action=login&email=${e}&token=${t}`);
        const j = await r.json();
        if(!j.status) throw new Error(j.msg);
        EMAIL = j.email;
        $("userEmailDisplay").innerText = EMAIL;
        $("loginBox").classList.add("hidden");
        $("mainBox").classList.remove("hidden");
        $("skema").innerHTML = j.skema.map(s => `<option>${s}</option>`).join("");
    } catch (err) { alert(err.message); }
}

async function loadData() {
    $("list").innerHTML = "Memuat...";
    try {
        const r = await fetch(`${API_URL}?action=list&email=${EMAIL}&skema=${$("skema").value}`);
        DATA = await r.json();
        if(DATA.length === 0) {
            $("list").innerHTML = "Tidak ada antrean.";
            $("btnSave").classList.add("hidden");
        } else {
            $("btnSave").classList.remove("hidden");
            $("list").innerHTML = DATA.map((r, i) => `
                <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100 cursor-pointer">
                    <input type="checkbox" checked data-i="${i}" class="w-4 h-4 rounded text-emerald-600">
                    <div class="flex-1">
                        <div class="text-[11px] font-bold text-slate-700">${r.nama}</div>
                        <div class="text-[9px] text-slate-400 font-bold uppercase">${r.nip}</div>
                    </div>
                </label>
            `).join("");
        }
    } catch (err) { alert("Gagal mengambil data"); }
}

async function simpanData() {
    const rows = [];
    document.querySelectorAll("#list input:checked").forEach(cb => rows.push(DATA[cb.dataset.i]));
    if(rows.length === 0) return alert("Pilih minimal satu.");

    $("btnSave").disabled = true;
    $("btnSave").innerText = "Menyimpan...";

    try {
        const payload = new URLSearchParams();
        payload.append("action", "simpan");
        payload.append("email", EMAIL);
        payload.append("skema", $("skema").value);
        payload.append("rows", JSON.stringify(rows));

        const r = await fetch(API_URL, { method: "POST", body: payload });
        const j = await r.json();
        alert(j.msg);
        loadData();
    } catch (err) { alert("Gagal menyimpan."); }
    finally { $("btnSave").disabled = false; $("btnSave").innerText = "Konfirmasi Kehadiran"; }
}
</script>
</body>
</html>
